[pytest]
testpaths = tests
# Le chemin backend/ est ajouté par tests/conftest.py : pytest marche
# aussi bien depuis backend/ que depuis la racine du dépôt.
addopts = -ra
filterwarnings =
    # Migration Pydantic v2 (class Config → ConfigDict) : à traiter séparément
    ignore::pydantic.warnings.PydanticDeprecatedSince20
